name: Frontend CI, Quality & Clean-Room Security Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Supply-Chain Security (agency-devops-automator): Least-privilege GITHUB_TOKEN
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    name: Build, Typecheck, Lint & Bundle Budget Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 40-char SHA pinned against tag-hijacking (agency-devops-automator)
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: latest

      - name: Zero-Bloat Dependency Gate (agency-frontend-developer)
        run: |
          echo "Auditing package.json against redundant utility bloat..."
          if grep -E '"(lodash|moment|axios|classnames|uuid)"\s*:' package.json; then
            echo "::error::Banned utility package detected in package.json! Prefer native Web APIs (Intl, fetch, crypto.randomUUID)."
            exit 1
          fi
          echo "Zero-Bloat Dependency Gate passed."

      - name: Broken-Windows Static Audit (agency-code-reviewer)
        run: |
          echo "Scanning src/ for debugger statements and empty swallowed catch blocks..."
          if grep -rnE '\bdebugger\s*;' src/; then
            echo "::error::Residual 'debugger;' statement found in src/!"
            exit 1
          fi
          if grep -rnPzo 'catch\s*(\([^)]*\))?\s*\{\s*\}' src/ >/dev/null 2>&1; then
            echo "::error::Empty swallowed catch block detected in src/ (Dead Programs Tell No Lies)."
            exit 1
          fi
          echo "Broken-Windows Static Audit passed."

      - name: Deterministic Dependency Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Run ESLint Verification
        run: bun run lint

      - name: Run TypeScript Compiler & Vite Production Build
        run: bun run build

  clean-room-security:
    name: Secret, Credential & LGPD Clean-Room Hygiene Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Block committed .env files, private keys & hardcoded tokens (agency-secrets-credential-hygiene-engineer)
        run: |
          echo "Checking tracked files for committed .env or private keys..."
          if git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -vE '\.env\.example$'; then
            echo "::error::Committed .env file detected! Commit only .env.example with synthetic placeholders."
            exit 1
          fi
          if grep -rnE '(BEGIN (RSA|OPENSSH|EC|PGP|PRIVATE) KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|sk-[A-Za-z0-9]{20,})' src/ public/ package.json 2>/dev/null; then
            echo "::error::Hardcoded secret or private key pattern detected!"
            exit 1
          fi
          if grep -rnE 'VITE_[A-Z0-9_]*(SECRET|PRIVATE|PASSWORD|PASSWD)' src/ 2>/dev/null; then
            echo "::error::Client-exposed secret variable (VITE_*_SECRET/PASSWORD) detected in src/!"
            exit 1
          fi
          echo "Secrets & Credential Hygiene check passed."

      - name: Block bundled reference PDFs & Brazilian PII / CPF leaks (agency-clean-room-data-hygiene-engineer)
        run: |
          echo "Scanning src/ and public/ for bundled reference PDFs and LGPD PII patterns..."
          if git ls-files public/ src/ | grep -iE '\.pdf$'; then
            echo "::error::Bundled PDF detected in public/ or src/! Never ship reference PDFs in the repository."
            exit 1
          fi
          if grep -rnE '\b[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}\b|\b[0-9]{2}\.[0-9]{3}\.[0-9]{3}/[0-9]{4}-[0-9]{2}\b' src/ public/ 2>/dev/null; then
            echo "::error::Potential Brazilian CPF/CNPJ detected in src/ or public/! Use synthetic test fixtures only."
            exit 1
          fi
          if grep -rnP '\b[A-Za-z0-9._%+-]+@(?!([A-Za-z0-9-]+\.)?(example\.(com|org|net)|test|invalid|localhost)\b)[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b' src/ public/ 2>/dev/null; then
            echo "::error::Non-reserved email domain detected in src/ or public/! Use RFC 2606 reserved domains (@example.com) in fixtures."
            exit 1
          fi
          echo "Clean-Room & LGPD Data Hygiene check passed."
